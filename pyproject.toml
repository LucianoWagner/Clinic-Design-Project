[project]
name = "consultorio-agent"
version = "0.1.0"
description = "MVP web agent for medical appointment scheduling"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "fastapi-limiter==0.1.6",
  "httpx>=0.27.0",
  "langchain-groq>=0.3.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "pwdlib[argon2]>=0.2.1",
  "PyJWT>=2.9.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.5.2",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "redis>=5.0.0",
  "qrcode[pil]>=7.4.2",
  "resend>=2.4.0",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
